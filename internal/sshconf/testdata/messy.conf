# Personal ssh config
# last touched 2024-11-02

Host bastion.prod        # jump box, do not delete
    HostName bastion.prod.example.com
    User ops
    Port 2222
    IdentityFile ~/.ssh/id_ed25519_prod

Host web-* !web-legacy
	hostname 10.0.1.10
	user deploy
	ForwardAgent yes

Host db
  HostName=db.internal
  User = dba
  # keep the timeout low, this box reboots a lot
  ConnectTimeout 5

Host quoted
  ProxyCommand "/usr/local/bin/my proxy" -W %h:%p
  RemoteCommand "tmux new -A -s main"

Host *
  ServerAliveInterval 60
  AddKeysToAgent yes
